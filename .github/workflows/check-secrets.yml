name: Check secrets (reusable)

on:
  workflow_call:
    inputs:
      kingfisher_excludes:
        description: Space-separated paths, each passed to Kingfisher as --exclude.
        type: string
        required: false
        default: ""
      kingfisher_skip_regex:
        description: One regular expression passed to Kingfisher as --skip-regex. Join alternatives with |. This is the only way to suppress a finding in git history.
        type: string
        required: false
        default: ""
      noseyparker_ignore_file:
        description: Nosey Parker ignore file, passed with -i only when it exists.
        type: string
        required: false
        default: ".noseyparker-ignore.txt"
      noseyparker_findings_exclude:
        description: Comma-separated Nosey Parker finding ids dropped from the verdict. An id the scan did not report fails the job.
        type: string
        required: false
        default: ""
      titus_rules_exclude:
        description: Comma-separated rule ids (for example np.aws.2) passed to Titus as --rules-exclude. This is the only way to suppress a Titus finding in git history.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  scan:
    name: ${{ matrix.scanner }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scanner: [kingfisher, trufflehog, noseyparker, titus]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restrict the scan to the checked-out ref
        # fetch-depth 0 fetches every branch, so a secret on an unmerged branch would be scanned as history.
        run: |
          set -euo pipefail
          git checkout --quiet --detach HEAD
          git for-each-ref --format='%(refname)' | while read -r ref; do
            git update-ref -d "${ref}"
          done
          git reflog expire --expire=now --all
          git gc --prune=now --quiet

      - name: Install ${{ matrix.scanner }}
        env:
          SCANNER: ${{ matrix.scanner }}
        run: |
          set -euo pipefail
          case "${SCANNER}" in
            kingfisher)
              url=https://github.com/mongodb/kingfisher/releases/download/v2.11.1/kingfisher-linux-x64.tgz
              sha256=84e4a4c45814f05e80aa8eee768e5170d758736fa116ffaf03565da4d5a77447
              member=kingfisher
              ;;
            trufflehog)
              url=https://github.com/trufflesecurity/trufflehog/releases/download/v3.99.2/trufflehog_3.99.2_linux_amd64.tar.gz
              sha256=3c7b0d1dc4278294269bfdd7594bca8bb28c78da0a4a06ad202ded37b48deca4
              member=trufflehog
              ;;
            noseyparker)
              url=https://github.com/praetorian-inc/noseyparker/releases/download/v0.24.0/noseyparker-v0.24.0-x86_64-unknown-linux-gnu.tar.gz
              sha256=1bd04ea06ce886a7cd1995a814c5570be01b019adacf27fd158cbdfb01da1f3c
              member=bin/noseyparker
              ;;
            titus)
              url=https://github.com/praetorian-inc/titus/releases/download/v1.2.11/titus-linux-amd64
              sha256=c3c5bc8dccdc59cc1583384b28bf9d85c9fb93f7f758e665440e7d296dac351b
              member=
              ;;
            *)
              echo "::error::Unknown scanner '${SCANNER}'" >&2
              exit 1
              ;;
          esac
          download="${RUNNER_TEMP}/${url##*/}"
          bin="${RUNNER_TEMP}/bin"
          mkdir --parents "${bin}"
          curl --silent --show-error --location --fail --output "${download}" "${url}"
          echo "${sha256}  ${download}" | sha256sum --check --strict
          if [ -n "${member}" ]; then
            unpacked="$(mktemp --directory --tmpdir="${RUNNER_TEMP}")"
            tar --extract --gzip --file "${download}" --directory "${unpacked}"
            install --mode 0755 "${unpacked}/${member}" "${bin}/${SCANNER}"
          else
            install --mode 0755 "${download}" "${bin}/${SCANNER}"
          fi
          echo "${bin}" >> "${GITHUB_PATH}"

      - name: Run Kingfisher
        if: matrix.scanner == 'kingfisher'
        # Inputs go through env, never into the script text.
        env:
          KINGFISHER_EXCLUDES: ${{ inputs.kingfisher_excludes }}
          KINGFISHER_SKIP_REGEX: ${{ inputs.kingfisher_skip_regex }}
        run: |
          set -euo pipefail
          args=(--no-update-check --git-history full --format pretty --jobs "$(nproc)")
          for path in ${KINGFISHER_EXCLUDES}; do
            args+=(--exclude "${path}")
          done
          if [ -n "${KINGFISHER_SKIP_REGEX}" ]; then
            args+=(--skip-regex "${KINGFISHER_SKIP_REGEX}")
          fi
          kingfisher scan "${args[@]}" .

      - name: Run TruffleHog
        if: matrix.scanner == 'trufflehog'
        # --only-verified fails the job only for secrets the provider confirms are live.
        run: trufflehog filesystem --no-update --fail --only-verified .

      - name: Run Nosey Parker
        if: matrix.scanner == 'noseyparker'
        # scan and report exit 0 even with findings, so the verdict comes from the JSON report.
        env:
          NOSEYPARKER_IGNORE_FILE: ${{ inputs.noseyparker_ignore_file }}
          NOSEYPARKER_FINDINGS_EXCLUDE: ${{ inputs.noseyparker_findings_exclude }}
        run: |
          set -euo pipefail
          datastore="${RUNNER_TEMP}/noseyparker.datastore"
          # Ignore only .git/config, which can hold the checkout credential. Ignoring all of .git/ hides history.
          runner_ignore="${RUNNER_TEMP}/noseyparker-ignore.txt"
          printf '.git/config\n' > "${runner_ignore}"
          ignores=(--ignore "${runner_ignore}")
          if [ -f "${NOSEYPARKER_IGNORE_FILE}" ]; then
            ignores+=(--ignore "${NOSEYPARKER_IGNORE_FILE}")
          fi
          noseyparker scan --datastore "${datastore}" "${ignores[@]}" .
          noseyparker report --datastore "${datastore}"
          report="$(noseyparker report --datastore "${datastore}" --format json)"
          excluded="$(tr ',' '\n' <<< "${NOSEYPARKER_FINDINGS_EXCLUDE}" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | sed '/^$/d' | jq --raw-input . | jq --slurp --compact-output .)"
          unknown="$(jq --raw-output --argjson excluded "${excluded}" '($excluded - [.[].finding_id])[]' <<< "${report}")"
          if [ -n "${unknown}" ]; then
            echo "::error::noseyparker_findings_exclude names finding ids this scan did not report: ${unknown//$'\n'/, }. A suppression outlived its finding; remove it." >&2
            exit 1
          fi
          remaining="$(jq --argjson excluded "${excluded}" '[.[] | select(.finding_id as $id | $excluded | index($id) | not)] | length' <<< "${report}")"
          if [ "${remaining}" -ne 0 ]; then
            echo "::error::Nosey Parker found secrets: ${remaining} findings. See the report above." >&2
            exit 1
          fi

      - name: Run Titus
        if: matrix.scanner == 'titus'
        # titus scan exits 0 even with findings, so the verdict comes from the JSON output.
        env:
          TITUS_RULES_EXCLUDE: ${{ inputs.titus_rules_exclude }}
        run: |
          set -euo pipefail
          args=(--git --output :memory:)
          if [ -n "${TITUS_RULES_EXCLUDE}" ]; then
            args+=(--rules-exclude "${TITUS_RULES_EXCLUDE}")
          fi
          titus scan "${args[@]}" .
          findings="$(titus scan "${args[@]}" --format json . | jq 'length')"
          if [ "${findings}" -ne 0 ]; then
            echo "::error::Titus found secrets: ${findings} findings. See the report above." >&2
            exit 1
          fi
