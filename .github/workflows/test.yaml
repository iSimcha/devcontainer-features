name: Test features

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Run shellcheck over the install scripts
        run: shellcheck --external-sources src/*/*.sh test/*/*.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # dev-tools needs npm, which the autogenerated base image does not ship, so it is
          # covered by scenarios that add the node feature.
          - feature: dev-shell
            flags: ""
          - feature: dev-tools
            flags: "--skip-autogenerated --skip-duplicated"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install the dev container CLI
        run: npm install --global @devcontainers/cli

      - name: Test ${{ matrix.feature }}
        run: devcontainer features test --features ${{ matrix.feature }} ${{ matrix.flags }} --project-folder .
